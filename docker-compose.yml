# ====================================== AIRFLOW ENVIRONMENT VARIABLES =======================================
x-environment: &airflow_environment
  env_file: .env

x-airflow-image: &airflow_image apache/airflow:2.9.0-python3.10
# ====================================== /AIRFLOW ENVIRONMENT VARIABLES ======================================

services:
  shoreline_db:
    <<: *airflow_environment
    image: postgis/postgis:13-3.4
    environment:
      - POSTGRES_USER=shoreline
      - POSTGRES_PASSWORD=shoreline
      - POSTGRES_DB=shoreline
    ports:
      - "5433:5432"
    volumes:
      - ./db/shoreline_db:/docker-entrypoint-initdb.d/
      - ./data/shorelineDB:/var/lib/postgresql/data

  pgadmin:
    <<: *airflow_environment
    image: dpage/pgadmin4
    depends_on:
      - shoreline_db
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@shoreline.com 
      PGADMIN_DEFAULT_PASSWORD: admin 
    ports:
      - "80:80"
    volumes:
      - ./data/pgadmin:/var/lib/pgadmin

  airflow_db:
    <<: *airflow_environment
    image: postgres:13
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    ports:
      - "5432:5432"
    volumes:
      - ./data/airflowDB:/var/lib/postgresql/data

  init:
    <<: *airflow_environment
    build:
      context: images/airflow-docker
      args:
        AIRFLOW_BASE_IMAGE: *airflow_image
    image: shoreline-pipeline/airflow
    depends_on:
      # - shoreline_db
      - airflow_db 
    entrypoint: /bin/bash
    command: -c 'airflow db init && airflow users create --username admin --password admin --firstname Anonymous --lastname Admin --role Admin --email admin@example.org'

  webserver:
    <<: *airflow_environment
    build:
      context: images/airflow-docker
      args:
        AIRFLOW_BASE_IMAGE: *airflow_image
    image: shoreline-pipeline/airflow
    restart: always
    depends_on:
      - airflow_db 
    ports:
      - "8080:8080"
    volumes:
      - logs:/opt/airflow/logs
    command: webserver

  scheduler:
    <<: *airflow_environment
    build:
      context: images/airflow-docker
      args:
        AIRFLOW_BASE_IMAGE: *airflow_image
    image: shoreline-pipeline/airflow
    restart: always
    depends_on:
      - airflow_db 
    volumes:
      - logs:/opt/airflow/logs
      - ./dags:/opt/airflow/dags
      - /var/run/docker.sock:/var/run/docker.sock
    command: scheduler

volumes:
  logs:
